{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}AI Powered Job Application Trackr{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/dashboard.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/application-form.css' %}"
    >

    <link
    rel="stylesheet"
    href="{% static 'css/application-list.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/application-detail.css' %}"
    >

</head>


    <body>

        {% if messages %}

        <div class="toast-container">

            {% for message in messages %}

                <div class="toast-message">
                    {{ message }}
                </div>

            {% endfor %}

        </div>

    {% endif %}

    <div class="app-layout">

        {% include 'includes/sidebar.html' %}


        <main class="main-content">

            {% block content %}

            {% endblock %}

        </main>

    </div>

</body>

</html>
